x-logging-and-limits: &high-perf
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  sysctls:
    - net.core.somaxconn=8192
    - net.ipv4.tcp_max_syn_backlog=8192
    - net.ipv4.tcp_fin_timeout=25
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-logging-minimal: &minimal-perf
  logging:
    driver: "json-file"
    options:
      max-size: "5m"
      max-file: "1"

services:

  xray-config:
    build:
      context: ./xray-config
      dockerfile: Dockerfile
    restart: always
    <<: *minimal-perf
    env_file:
      - env_file
    environment:
      - TZ=UTC
      - PYTHONPATH=/
    volumes:
      - "/etc/machine-id:/host/etc/machine-id"
      - "acme:/root/.acme.sh/"
      - "./shared_lib:/shared_lib:ro"
      - "./env_file:/root/env_file:ro"
      - "/var/log/compassvpn:/var/log/compassvpn:rw"

  xray:
    build:
      context: ./xray
      dockerfile: Dockerfile
    <<: *high-perf
    volumes:
      - "/var/log/compassvpn:/var/log/compassvpn:rw"
      - "./shared_lib:/shared_lib:ro"
      - "./env_file:/env_file:ro"
    cap_add:
      - NET_ADMIN
    restart: always
    env_file:
      - env_file
    environment:
      - TZ=UTC
      - PYTHONPATH=/
    depends_on:
      - xray-config
    ports:
      - "8080:8080/tcp"
      - "8080:8080/udp"
      - "443:443/tcp"
      - "443:443/udp"

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    <<: *high-perf
    volumes:
      - "acme:/root/.acme.sh/"
      - "/var/log/compassvpn:/var/log/compassvpn:rw"
      - "/var/log/nginx:/var/log/nginx:rw"
      - "./shared_lib:/shared_lib:ro"
    restart: always
    env_file:
      - env_file
    ports:
      - "8880:8880/tcp"
      - "8880:8880/udp"
      - "2053:2053/tcp"
      - "2053:2053/udp"
      - "8443:8443/tcp"
      - "8443:8443/udp"
    environment:
      - TZ=UTC
      - PYTHONPATH=/
    depends_on:
      - xray

  xray-exporter:
    build:
      context: ./xray-exporter
      dockerfile: Dockerfile
    restart: always
    <<: *minimal-perf
    depends_on:
      - xray
    volumes:
      - /var/log/compassvpn:/var/log/compassvpn:ro
      - "./shared_lib:/shared_lib:ro"
    ports:
      - "9550:9550"
    environment:
      - LOG_LEVEL=info
      - PYTHONPATH=/

  metric-forwarder:
    build:
      context: ./metric-forwarder
      dockerfile: Dockerfile
    restart: always
    <<: *minimal-perf
    env_file:
      - env_file
    environment:
      - TZ=UTC
      - PYTHONPATH=/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "./shared_lib:/shared_lib:ro"
      - "./env_file:/env_file:ro"
    depends_on:
      - xray-config
      - node-exporter

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: always
    network_mode: host
    <<: *minimal-perf
    volumes:
      - "/proc:/host/proc:ro"
      - "/sys:/host/sys:ro"
      - "/:/rootfs:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - TZ=UTC
    command:
      - "--log.level=warn"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - '--collector.disable-defaults'
      - '--collector.uname'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.filesystem'
      - '--collector.netdev'
      - '--collector.time'
      - '--collector.stat'
      - '--collector.pressure'
      - "--web.listen-address=172.17.0.1:9100" # only allow access from host.docker.internal interface

  fail2ban:
    build:
      context: ./fail2ban
      dockerfile: Dockerfile
    restart: always
    network_mode: host
    <<: *minimal-perf
    environment:
      - TZ=UTC
      - F2B_LOG_TARGET=STDOUT
      - F2B_LOG_LEVEL=NOTICE
      - LOG_DIR=/var/log/compassvpn
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "fail2ban-client", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - "/var/log:/var/log:ro"
      - "./fail2ban/data:/data"
      - "./fail2ban/jail.d:/etc/fail2ban/jail.d:ro"
      - "./fail2ban/jail.local:/etc/fail2ban/jail.local:ro"
      - "./fail2ban/filter.d:/etc/fail2ban/filter.d:ro"

volumes:
  acme:
