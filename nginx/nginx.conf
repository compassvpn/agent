user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/compassvpn/nginx_error.log ${NGINX_LOG_LEVEL};
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex on;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/compassvpn/nginx_access.log main;
    resolver 1.1.1.2;

    # Return 403 for sensitive locations
    map $request_uri $is_forbidden_path {
        default 0;
        ~*/\.git/.*$ 1;
        ~*/\.env$ 1;
        ~*/\.config$ 1;
        ~*/\.htaccess$ 1;
        ~*/wp-admin/.*$ 1;
        ~*/admin/.*$ 1;
        ~*/administrator/.*$ 1;
        ~*/wp-login\.php$ 1;
        ~*/phpmyadmin/.*$ 1;
        ~*/mysql/.*$ 1;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    map $remote_addr $proxy_forwarded_elem {
        ~^[0-9.]+$        "for=$remote_addr";
        ~^[0-9A-Fa-f:.]+$ "for=\"[$remote_addr]\"";
        default           "for=unknown";
    }

    map $http_forwarded $proxy_add_forwarded {
        "~^(,[ \t]*)*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\t \x21\x23-\x5B\x5D-\x7E\x80-\xFF]|\\[\t \x21-\x7E\x80-\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\t \x21\x23-\x5B\x5D-\x7E\x80-\xFF]|\\[\t \x21-\x7E\x80-\xFF])*\"))?)*([ \t]*,([ \t]*([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\t \x21\x23-\x5B\x5D-\x7E\x80-\xFF]|\\[\t \x21-\x7E\x80-\xFF])*\"))?(;([!#$%&'*+.^_`|~0-9A-Za-z-]+=([!#$%&'*+.^_`|~0-9A-Za-z-]+|\"([\t \x21\x23-\x5B\x5D-\x7E\x80-\xFF]|\\[\t \x21-\x7E\x80-\xFF])*\"))?)*)?)*$" "$http_forwarded, $proxy_forwarded_elem";
        default "$proxy_forwarded_elem";
    }

    # Vless-TCP-TLS Fallback handling.
    server {
        listen 0.0.0.0:8001 proxy_protocol;
        http2 on;

        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;

        # Block sensitive paths
        if ($is_forbidden_path = 1) {
            return 403;
        }

        # Forwards all incoming requests from xray to an external website.
        location / {
            sub_filter $proxy_host $host;
            sub_filter_once off;
            set $website ${NGINX_FAKE_WEBSITE};
            proxy_pass https://$website;

            proxy_set_header Host $proxy_host;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
            proxy_ssl_server_name on;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # Vless-XHTTP Handling.
    server {
        listen 8880;
        listen [::]:8880;
        http2 on;

        # Block sensitive paths
        if ($is_forbidden_path = 1) {
            return 403;
        }

        # Forwards this path requests to xray (direct).
        location /${NGINX_PATH}/1 {
            proxy_pass http://xray:8004;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 315;
        }

        # Forwards this path requests to xray (cdn).
        location /${NGINX_PATH}/cdn/1 {
            proxy_pass http://xray:8044;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 315;
        }

        include /etc/nginx/locations.d/8880/replicas.conf;

        # Fallback all other requests to an external website.
        location / {
            sub_filter $proxy_host $host;
            sub_filter_once off;
            set $website ${NGINX_FAKE_WEBSITE};
            proxy_pass https://$website;

            proxy_set_header Host $proxy_host;
            proxy_http_version 1.1;
            proxy_cache_bypass $http_upgrade;
            proxy_ssl_server_name on;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Forwarded $proxy_add_forwarded;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # TLS server blocks (ports 2053 and 8443) are rendered into this file by
    # the entrypoint only when a Cloudflare subdomain and certificate are
    # available. The file is always present (empty for non-CF deployments) so
    # this include never causes a startup error.
    include /etc/nginx/conf.d/tls_servers.conf;
}
